# Releases a hash-stable source archive on v* tags; the Publish to BCR app
# turns the release into a registry PR (see .bcr/).
name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build release archive
        run: |
          version="${GITHUB_REF_NAME#v}"
          git archive --format=tar.gz \
            --prefix="rules_varlink-${version}/" \
            -o "rules_varlink-${GITHUB_REF_NAME}.tar.gz" \
            "${GITHUB_REF_NAME}"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          cat > notes.md <<EOF
          ## Bzlmod

          \`\`\`starlark
          bazel_dep(name = "rules_varlink", version = "${version}")
          \`\`\`
          EOF
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file notes.md \
            "rules_varlink-${GITHUB_REF_NAME}.tar.gz"
