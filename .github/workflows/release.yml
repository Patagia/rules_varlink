# Releases a hash-stable source archive on v* tags, then opens the BCR
# registry PR via the publish-to-bcr reusable workflow (see .bcr/).
name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build release archive
        run: |
          version="${GITHUB_REF_NAME#v}"
          git archive --format=tar.gz \
            --prefix="rules_varlink-${version}/" \
            -o "rules_varlink-${GITHUB_REF_NAME}.tar.gz" \
            "${GITHUB_REF_NAME}"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          cat > notes.md <<EOF
          ## Bzlmod

          \`\`\`starlark
          bazel_dep(name = "rules_varlink", version = "${version}")
          \`\`\`
          EOF
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file notes.md \
            "rules_varlink-${GITHUB_REF_NAME}.tar.gz"

  # Chained here because the release is created with github.token, whose
  # events never trigger other workflows.
  publish-to-bcr:
    needs: release
    uses: bazel-contrib/publish-to-bcr/.github/workflows/publish.yaml@v1.4.2
    with:
      tag_name: ${{ github.ref_name }}
      registry_fork: Patagia/bazel-central-registry
      attest: false
      draft: false
      download_default_release_artifacts: false
    secrets:
      publish_token: ${{ secrets.BCR_PUBLISH_TOKEN }}
